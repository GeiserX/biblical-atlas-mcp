name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-version:
    # Runs before anything publishes: the tag, package.json and server.json must
    # name the same version, or postinstall.js and the MCP registry would point
    # at a release that does not match.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          # server.json carries the version twice: its own, and packages[0].version,
          # the npm version the MCP registry installs.
          for field in "package.json:.version" "server.json:.version" "server.json:.packages[0].version"; do
            f="${field%%:*}"
            got=$(node -p "require('./$f')${field#*:}")
            if [ "$got" != "$v" ]; then
              echo "::error file=$f::${field#*:} is $got, the tag says $v"
              exit 1
            fi
          done

  goreleaser:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # .goreleaser.yaml skips signing when the secrets are absent, which is
      # right for snapshots and wrong for a release: stop here instead.
      - name: Require the macOS signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          missing=0
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # Signed build provenance for every archive in checksums.txt, stored by
      # GitHub and checkable with: gh attestation verify <archive> --repo <owner/repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  image:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          DOCKERHUB_ENABLED: ${{ vars.DOCKERHUB_ENABLED }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          tags="ghcr.io/geiserx/biblical-atlas-mcp:${GITHUB_REF_NAME}"
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            tags="${tags},${DOCKERHUB_NAMESPACE}/biblical-atlas-mcp:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Same version and commit strings as the GoReleaser binaries.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ steps.tags.outputs.commit }}
            DATE=${{ steps.tags.outputs.date }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

  npm:
    needs: goreleaser
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # postinstall.js checks the archive against this copy, which npm's
      # provenance then covers, not against a file it would fetch from the
      # release, where whoever can replace an archive can replace its sum.
      - name: Bundle the release's checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir .
          v="${GITHUB_REF_NAME#v}"
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            ext=tar.gz
            case "$target" in windows_*) ext=zip ;; esac
            grep -Eq "^[0-9a-f]{64}  biblical-atlas-mcp_${v}_${target}\.${ext}\$" checksums.txt || { echo "::error::checksums.txt lacks ${target}"; exit 1; }
          done
          npm pack --dry-run --json --ignore-scripts | node -e 'const p=JSON.parse(require("fs").readFileSync(0))[0]; if(!p.files.some(f=>f.path==="checksums.txt")){console.error("checksums.txt is not in the package");process.exit(1)}'
      - run: npm publish --ignore-scripts

  mcp-registry:
    needs: npm
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
