version: 2

project_name: biblical-atlas-mcp

release:
  github:
    owner: GeiserX
    name: biblical-atlas-mcp
  draft: false
  prerelease: auto

builds:
  - id: bin
    main: ./cmd/server
    binary: biblical-atlas-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/geiserx/biblical-atlas-mcp/version.Version={{ .Version }}
      - -X github.com/geiserx/biblical-atlas-mcp/version.Commit={{ .ShortCommit }}
      - -X github.com/geiserx/biblical-atlas-mcp/version.Date={{ .Date }}

# Signs the darwin binaries with a Developer ID certificate and notarizes them
# with Apple, from Linux, before they are archived. Skipped when the secrets
# are absent (pull requests, snapshots); release.yml fails a tag build that
# lacks any of them, so a release is never shipped unsigned by accident.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [bin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: dist
    ids: [bin]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
